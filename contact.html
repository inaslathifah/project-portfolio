<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <meta name="description"
        content="Portfolio Inas Lathifah, lulusan Teknik Informatika yang bekerja di web development, mobile, dan UI/UX design.">
    <link rel="icon" href="image/apple-touch-icon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header id="header">
        <div class="nav-container">
            <a href="home.html" class="brand">Inas Lathifah</a>

            <button id="nav-toggle" class="nav-toggle" aria-expanded="false" aria-controls="navbar"
                aria-label="Buka menu navigasi">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav id="navbar" class="navbar">
                <a href="home.html">Beranda</a>
                <a href="ability.html">Keahlian</a>
                <a href="about.html">Tentang</a>
                <a href="projects.html">Proyek</a>
                <a href="contact.html">Kontak</a>
            </nav>
        </div>
    </header>
    
    <!-- Contact -->
    <section id="contact" class="section section-alt">
        <div class="container">
            <h2>Kontak</h2>
            <p class="section-lead">Ada pertanyaan, masukan, atau ingin diskusi proyek? Isi form di bawah ini.
            </p>

            <form action="#" method="post" class="contact-form">
                <div class="form-row">
                    <label for="nama">Nama</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda" required>
                </div>

                <div class="form-row">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Masukkan email Anda" required>
                </div>

                <div class="form-row">
                    <label for="alasan">Kritik dan Saran</label>
                    <textarea id="alasan" name="alasan" rows="6" required></textarea>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Kirim</button>
                    <button type="reset" class="btn btn-secondary">Batal</button>
                </div>
            </form>
        </div>
    </section>
</body>

</html>
